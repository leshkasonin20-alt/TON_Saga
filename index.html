<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Saga - Cosmic Saga</title>
    <!-- ... (остальные скрипты прежние) ... -->
    <style>
        /* Новые стили для панели героев */
        .hero-abilities-panel {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-top: 2px solid #0088cc;
        }
        .hero-slot {
            width: 22%;
            text-align: center;
        }
        .hero-img {
            width: 100%;
            border-radius: 8px;
            border: 2px solid #555;
            cursor: pointer;
        }
        .mana-bar {
            height: 6px;
            background: #222;
            margin-top: 5px;
            border-radius: 3px;
        }
        .mana-fill { height: 100%; background: #00d2ff; width: 0%; transition: width 0.3s; }
        
        /* Экран Сюжета */
        .mission-card {
            background: var(--panel-bg);
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #0088cc;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- ЭКРАН СЮЖЕТА (Новый) -->
    <div id="story-screen" class="screen">
        <h2 class="screen-title">КОСМИЧЕСКАЯ САГА</h2>
        <div class="mission-card" onclick="startGame()">
            <h3>Миссия 1: Планета X</h3>
            <p>Зачистка сектора от инсектоидов</p>
        </div>
        <button class="btn-back" onclick="switchScreen('menu-screen')">Назад</button>
    </div>

    <!-- В ЭКРАНЕ БИТВЫ (#game-screen) добавь этот блок под доской -->
    <div class="hero-abilities-panel">
        <div class="hero-slot">
            <img src="images/blue_trooper.png" class="hero-img" onclick="useHeroSkill('blue')">
            <div class="mana-bar"><div class="mana-fill" id="mana-blue"></div></div>
        </div>
        <div class="hero-slot">
            <img src="images/green_insectoid.png" class="hero-img" onclick="useHeroSkill('green')">
            <div class="mana-bar"><div class="mana-fill" id="mana-green"></div></div>
        </div>
        <div class="hero-slot">
            <img src="images/purple_mystic.png" class="hero-img" onclick="useHeroSkill('purple')">
            <div class="mana-bar"><div class="mana-fill" id="mana-purple"></div></div>
        </div>
        <div class="hero-slot">
            <img src="images/red_assault.png" class="hero-img" onclick="useHeroSkill('red')">
            <div class="mana-bar"><div class="mana-fill" id="mana-red"></div></div>
        </div>
    </div>
</div>

<script>
    // Добавь эту логику в основной скрипт
    let heroMana = { blue: 0, green: 0, purple: 0, red: 0 };

    function useHeroSkill(color) {
        if (heroMana[color] >= 100) {
            alert("Использую навык: " + color.toUpperCase() + " СТРАЙК!");
            heroMana[color] = 0;
            updateManaUI();
            bossHp -= 50; // Наносим урон
            updateBossUI();
        } else {
            alert("Маны недостаточно!");
        }
    }

    function updateManaUI() {
        for(let color in heroMana) {
            document.getElementById('mana-' + color).style.width = heroMana[color] + '%';
        }
    }

    // При обновлении доски (в handleMatches) добавь начисление маны
    // heroMana[type] += 10;
    // updateManaUI();
</script>
</body>
</html>
